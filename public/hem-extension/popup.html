<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<style>
  body{font:13px system-ui,-apple-system,sans-serif;width:360px;margin:0;padding:14px;color:#1f2937;background:#fff}
  h1{font-size:16px;margin:0 0 10px;font-weight:800;color:#1e3a8a;display:flex;align-items:center;gap:6px}
  label{display:block;margin:10px 0 3px;font-weight:700;font-size:11px;color:#374151;text-transform:uppercase;letter-spacing:0.02em}
  select,input,button{width:100%;box-sizing:border-box;padding:8px 10px;font:inherit;border-radius:8px;border:1px solid #d1d5db}
  select,input{background:#f9fafb;font-size:12px}
  select:focus,input:focus{outline:2px solid #2563eb;background:#fff}
  button{margin-top:12px;cursor:pointer;border:0;background:#2563eb;color:#fff;padding:9px;font-weight:700;font-size:12px;transition:0.15s ease}
  button:hover{background:#1d4ed8}
  button.sec{background:#f3f4f6;color:#1f2937;border:1px solid #d1d5db}
  button.sec:hover{background:#e5e7eb}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px}.row>*{flex:1}
  #msg{margin-top:12px;padding:10px;border-radius:8px;display:none;white-space:pre-wrap;font-size:12px;line-height:1.4}
  .ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
  .err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
  .info{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:11px}
  td,th{border:1px solid #d1d5db;padding:4px 6px;text-align:left}
  th{background:#f3f4f6;font-weight:700}
  .hide{display:none}
  .card{background:#f8fafc;padding:10px;border-radius:8px;border:1px solid #e2e8f0;margin-top:8px}
</style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    HEM Sync (idMe KPM)
  </h1>
  <label>Jenis data</label>
  <select id="mode">
    <option value="students">Senarai murid</option>
    <option value="attendance">Kehadiran</option>
  </select>

  <button id="scan" class="sec">1. Baca jadual dari halaman ini</button>

  <div id="step2" class="hide">
    <div class="card">
      <label>Pilih Jadual Di Halaman</label>
      <select id="table"></select>
      <div id="dateWrap" class="hide">
        <label>Tarikh Kehadiran</label>
        <input type="date" id="date">
      </div>
      <div id="mapping" style="margin-top:8px"></div>
      <label style="font-weight:500;margin-top:10px;text-transform:none;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="allowOther" checked style="width:auto"> 
        <span>Terima ID bukan IC (pasport / MyKid / dokumen lain)</span>
      </label>
      <button id="preview" class="sec">2. Semak data</button>
    </div>
  </div>

  <div id="step3" class="hide">
    <div id="previewBox" style="max-height:160px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px;padding:4px;margin-top:8px"></div>
    <button id="send">3. Hantar ke HEM Digital</button>
  </div>

  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
